name: Four-site Playwright test

on:
  workflow_dispatch:
    inputs:
      site_urls:
        description: 'Four comma-separated URLs to test'
        required: false
        default: 'https://signon.sso.cba/identity/.well-known/openid-configuration,https://signon.sso.cba/pa/heartbeat.pf,https://proxy.sso.cba/pa/heartbeat.pf,https://radar.cloudflare.com/ip'

permissions:
  contents: read

jobs:
  test-and-publish:
    runs-on: [self-hosted, linux, x64]
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/four-site-browser-screenshot
      SITE_URLS: ${{ inputs.site_urls }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build container
        run: docker build --tag "$IMAGE_NAME:${GITHUB_SHA}" --tag "$IMAGE_NAME:latest" .

      - name: Run Playwright test in container
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          docker run --rm \
            --env SITE_URLS \
            --env HEADLESS=true \
            --volume "$GITHUB_WORKSPACE/artifacts:/app/test-results" \
            "$IMAGE_NAME:${GITHUB_SHA}"

      - name: Upload screenshots and network data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: four-site-playwright-results
          path: artifacts/
          if-no-files-found: warn

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push container to Docker Hub
        run: |
          docker push "$IMAGE_NAME:${GITHUB_SHA}"
          docker push "$IMAGE_NAME:latest"
