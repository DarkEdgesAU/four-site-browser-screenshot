name: Four-site Playwright test

on:
  workflow_dispatch:
    inputs:
      site_urls:
        description: 'Four comma-separated URLs to test'
        required: false
        default: 'https://signon.sso.cba/identity/.well-known/openid-configuration,https://signon.sso.cba/pa/heartbeat.pf,https://proxy.sso.cba/pa/heartbeat.pf,https://radar.cloudflare.com/ip'

permissions:
  contents: read

jobs:
  test-and-publish:
    runs-on: [self-hosted, linux, x64]
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/four-site-browser-screenshot
      SITE_URLS: ${{ inputs.site_urls }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build container
        run: docker build --tag "$IMAGE_NAME:${GITHUB_SHA}" --tag "$IMAGE_NAME:latest" .

      - name: Run Playwright test in container
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          docker run --rm \
            --env SITE_URLS \
            --env HEADLESS=true \
            --volume "$GITHUB_WORKSPACE/artifacts:/app/test-results" \
            "$IMAGE_NAME:${GITHUB_SHA}"

      - name: Upload site 1 screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-1-screenshot
          path: artifacts/site-screenshots/site-1.png
          if-no-files-found: warn

      - name: Upload site 2 screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-2-screenshot
          path: artifacts/site-screenshots/site-2.png
          if-no-files-found: warn

      - name: Upload site 3 screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-3-screenshot
          path: artifacts/site-screenshots/site-3.png
          if-no-files-found: warn

      - name: Upload site 4 screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-4-screenshot
          path: artifacts/site-screenshots/site-4.png
          if-no-files-found: warn

      - name: Upload network addresses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: network-addresses
          path: artifacts/site-screenshots/network-addresses.json
          if-no-files-found: warn

      - name: Upload request and response headers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: request-response-headers
          path: artifacts/site-screenshots/request-response-headers.json
          if-no-files-found: warn

      - name: Add request and response headers to job summary
        if: always()
        shell: bash
        run: |
          headers_file="artifacts/site-screenshots/request-response-headers.json"
          if [ -f "$headers_file" ]; then
            {
              echo '## Request and response headers'
              echo
              echo 'Sensitive headers are redacted.'
              echo
              echo '```json'
              cat "$headers_file"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push container to Docker Hub
        run: |
          docker push "$IMAGE_NAME:${GITHUB_SHA}"
          docker push "$IMAGE_NAME:latest"
