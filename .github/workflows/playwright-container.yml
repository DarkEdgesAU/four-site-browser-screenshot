name: Four-site Playwright test

on:
  schedule:
    # Rebuild the gallery daily to remove expired captures, even without new tests.
    - cron: '17 16 * * *'
  workflow_dispatch:
    inputs:
      site_urls:
        description: 'Four comma-separated URLs to test'
        required: false
        default: 'https://signon.sso.cba/identity/.well-known/openid-configuration,https://signon.sso.cba/pa/heartbeat.ping,https://proxy.sso.cba/pa/heartbeat.ping,https://radar.cloudflare.com/ip'

permissions:
  actions: read
  contents: read

concurrency:
  group: four-site-screenshots
  cancel-in-progress: false

jobs:
  test-on-arc:
    if: github.event_name == 'workflow_dispatch'
    runs-on: four-site-runner-set
    outputs:
      capture_ready: ${{ steps.upload_capture.outcome == 'success' }}
      capture_attempt: ${{ github.run_attempt }}
    container:
      image: docker.io/darkedges/four-site-browser-screenshot:latest
      env:
        SITE_URLS: ${{ inputs.site_urls }}
        HEADLESS: 'true'
      options: --ipc=host

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install project dependencies
        run: npm ci

      - name: Run Playwright test
        id: capture
        run: npm test -- --workers=1

      - name: Upload site 1 screenshot
        if: always()
        uses: actions/upload-artifact@v7
        id: upload_site_1
        with:
          path: test-results/site-screenshots/site-1.jpg
          if-no-files-found: warn
          archive: false
          retention-days: 7

      - name: Upload site 2 screenshot
        if: always()
        uses: actions/upload-artifact@v7
        id: upload_site_2
        with:
          path: test-results/site-screenshots/site-2.jpg
          if-no-files-found: warn
          archive: false
          retention-days: 7

      - name: Upload site 3 screenshot
        if: always()
        uses: actions/upload-artifact@v7
        id: upload_site_3
        with:
          path: test-results/site-screenshots/site-3.jpg
          if-no-files-found: warn
          archive: false
          retention-days: 7

      - name: Upload site 4 screenshot
        if: always()
        uses: actions/upload-artifact@v7
        id: upload_site_4
        with:
          path: test-results/site-screenshots/site-4.jpg
          if-no-files-found: warn
          archive: false
          retention-days: 7

      - name: Upload site 1 network address
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: test-results/site-screenshots/site-1-network-address.json
          if-no-files-found: warn
          archive: false
          retention-days: 7

      - name: Upload site 1 request and response headers
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: test-results/site-screenshots/site-1-request-response-headers.json
          if-no-files-found: warn
          archive: false
          retention-days: 7

      - name: Upload site 2 network address
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: test-results/site-screenshots/site-2-network-address.json
          if-no-files-found: warn
          archive: false
          retention-days: 7

      - name: Upload site 2 request and response headers
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: test-results/site-screenshots/site-2-request-response-headers.json
          if-no-files-found: warn
          archive: false
          retention-days: 7

      - name: Upload site 3 network address
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: test-results/site-screenshots/site-3-network-address.json
          if-no-files-found: warn
          archive: false
          retention-days: 7

      - name: Upload site 3 request and response headers
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: test-results/site-screenshots/site-3-request-response-headers.json
          if-no-files-found: warn
          archive: false
          retention-days: 7

      - name: Upload site 4 network address
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: test-results/site-screenshots/site-4-network-address.json
          if-no-files-found: warn
          archive: false
          retention-days: 7

      - name: Upload site 4 request and response headers
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: test-results/site-screenshots/site-4-request-response-headers.json
          if-no-files-found: warn
          archive: false
          retention-days: 7

      - name: Save capture for retained galleries
        id: upload_capture
        if: ${{ !cancelled() && steps.capture.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: gallery-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/site-screenshots/site-*.jpg
          if-no-files-found: error
          retention-days: 7

      - name: Upload site 1 browser diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: test-results/site-screenshots/site-1-browser-diagnostics.json
          archive: false
          retention-days: 7

      - name: Upload site 2 browser diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: test-results/site-screenshots/site-2-browser-diagnostics.json
          archive: false
          retention-days: 7

      - name: Upload site 3 browser diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: test-results/site-screenshots/site-3-browser-diagnostics.json
          archive: false
          retention-days: 7

      - name: Upload site 4 browser diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: test-results/site-screenshots/site-4-browser-diagnostics.json
          archive: false
          retention-days: 7

      - name: Add per-site headers to job summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Per-site network data'
            echo
            for site_number in 1 2 3 4; do
              network_file="test-results/site-screenshots/site-${site_number}-network-address.json"
              headers_file="test-results/site-screenshots/site-${site_number}-request-response-headers.json"
              if [ -f "$network_file" ] || [ -f "$headers_file" ]; then
                echo "### Site ${site_number}"
                echo
                if [ -f "$network_file" ]; then
                  echo '```json'
                  cat "$network_file"
                  printf '\n```\n\n'
                fi
                if [ -f "$headers_file" ]; then
                  echo
                  echo '<details><summary>Request and response headers (sensitive values redacted)</summary>'
                  echo
                  echo '```json'
                  cat "$headers_file"
                  printf '\n```\n\n'
                  echo '</details>'
                fi
                echo
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-pages:
    if: ${{ !cancelled() && (github.event_name == 'schedule' || needs.test-on-arc.outputs.capture_ready == 'true') }}
    needs: test-on-arc
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out gallery builder
        uses: actions/checkout@v4

      - name: Build galleries from the last seven days of captures
        env:
          GH_TOKEN: ${{ github.token }}
          CAPTURE_ATTEMPT: ${{ needs.test-on-arc.outputs.capture_attempt }}
        run: python3 scripts/build_gallery.py

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages
          retention-days: 1

      - name: Deploy retained galleries to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Add direct gallery links to job summary
        uses: actions/github-script@v7
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          CAPTURE_ATTEMPT: ${{ needs.test-on-arc.outputs.capture_attempt }}
        with:
          script: |
            const pagesBaseUrl = process.env.PAGES_URL.replace(/\/$/, '')
            core.summary
              .addHeading('Screenshot galleries', 2)
              .addRaw('<p>Direct GitHub Pages links: images load on the gallery page without GitHub’s Camo image proxy. Captures are retained for seven days; cleanup runs daily and after each new capture.</p>')
              .addLink('Browse retained runs', `${pagesBaseUrl}/`)
              .addBreak()
            if (context.eventName === 'workflow_dispatch') {
              const runUrl = `${pagesBaseUrl}/runs/${process.env.GITHUB_RUN_ID}/attempt-${process.env.CAPTURE_ATTEMPT}/`
              core.summary
                .addHeading('This run', 3)
                .addLink('Open all four screenshots for this run', runUrl)
                .addBreak()
              for (let site = 1; site <= 4; site++) {
                core.summary.addLink(`Site ${site} image`, `${runUrl}site-${site}.jpg`).addBreak()
              }
            }
            await core.summary.write()
