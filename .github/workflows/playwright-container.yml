name: Four-site Playwright test

on:
  workflow_dispatch:
    inputs:
      site_urls:
        description: 'Four comma-separated URLs to test'
        required: false
        default: 'https://signon.sso.cba/identity/.well-known/openid-configuration,https://signon.sso.cba/pa/heartbeat.pf,https://proxy.sso.cba/pa/heartbeat.pf,https://radar.cloudflare.com/ip'

permissions:
  contents: read

jobs:
  test-on-arc:
    runs-on: four-site-runner-set
    container:
      image: docker.io/darkedges/four-site-browser-screenshot:latest
      env:
        SITE_URLS: ${{ inputs.site_urls }}
        HEADLESS: 'true'
      options: --ipc=host

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install project dependencies
        run: npm ci

      - name: Run Playwright test
        run: npm test -- --workers=1

      - name: Upload site 1 screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-1-screenshot
          path: test-results/site-screenshots/site-1.png
          if-no-files-found: warn

      - name: Upload site 2 screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-2-screenshot
          path: test-results/site-screenshots/site-2.png
          if-no-files-found: warn

      - name: Upload site 3 screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-3-screenshot
          path: test-results/site-screenshots/site-3.png
          if-no-files-found: warn

      - name: Upload site 4 screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-4-screenshot
          path: test-results/site-screenshots/site-4.png
          if-no-files-found: warn

      - name: Upload network addresses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: network-addresses
          path: test-results/site-screenshots/network-addresses.json
          if-no-files-found: warn

      - name: Upload request and response headers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: request-response-headers
          path: test-results/site-screenshots/request-response-headers.json
          if-no-files-found: warn

      - name: Add request and response headers to job summary
        if: always()
        shell: bash
        run: |
          headers_file="test-results/site-screenshots/request-response-headers.json"
          if [ -f "$headers_file" ]; then
            {
              echo '## Request and response headers'
              echo
              echo 'Sensitive headers are redacted.'
              echo
              echo '```json'
              cat "$headers_file"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
