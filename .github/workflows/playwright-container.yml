name: Four-site Playwright test

on:
  workflow_dispatch:
    inputs:
      site_urls:
        description: 'Four comma-separated URLs to test'
        required: false
        default: 'https://signon.sso.cba/identity/.well-known/openid-configuration,https://signon.sso.cba/pa/heartbeat.ping,https://proxy.sso.cba/pa/heartbeat.ping,https://radar.cloudflare.com/ip'

permissions:
  actions: read
  contents: read

jobs:
  test-on-arc:
    runs-on: four-site-runner-set
    container:
      image: docker.io/darkedges/four-site-browser-screenshot:latest
      env:
        SITE_URLS: ${{ inputs.site_urls }}
        HEADLESS: 'true'
      options: --ipc=host

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install project dependencies
        run: npm ci

      - name: Run Playwright test
        run: npm test -- --workers=1

      - name: Upload site 1 screenshot
        if: always()
        uses: actions/upload-artifact@v7
        id: upload_site_1
        with:
          path: test-results/site-screenshots/site-1.jpg
          if-no-files-found: warn
          archive: false

      - name: Upload site 2 screenshot
        if: always()
        uses: actions/upload-artifact@v7
        id: upload_site_2
        with:
          path: test-results/site-screenshots/site-2.jpg
          if-no-files-found: warn
          archive: false

      - name: Upload site 3 screenshot
        if: always()
        uses: actions/upload-artifact@v7
        id: upload_site_3
        with:
          path: test-results/site-screenshots/site-3.jpg
          if-no-files-found: warn
          archive: false

      - name: Upload site 4 screenshot
        if: always()
        uses: actions/upload-artifact@v7
        id: upload_site_4
        with:
          path: test-results/site-screenshots/site-4.jpg
          if-no-files-found: warn
          archive: false

      - name: Upload network addresses
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: test-results/site-screenshots/network-addresses.json
          if-no-files-found: warn
          archive: false

      - name: Upload request and response headers
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: test-results/site-screenshots/request-response-headers.json
          if-no-files-found: warn
          archive: false

      - name: Add screenshot gallery and headers to job summary
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SITE_1_ID: ${{ steps.upload_site_1.outputs.artifact-id }}
          SITE_2_ID: ${{ steps.upload_site_2.outputs.artifact-id }}
          SITE_3_ID: ${{ steps.upload_site_3.outputs.artifact-id }}
          SITE_4_ID: ${{ steps.upload_site_4.outputs.artifact-id }}
        run: |
          resolve_blob_url() {
            artifact_id="$1"
            if [ -z "$artifact_id" ]; then
              return 0
            fi
            curl --fail --silent --show-error --location \
              --output /dev/null --write-out '%{url_effective}' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip"
          }

          site_1_url="$(resolve_blob_url "$SITE_1_ID")"
          site_2_url="$(resolve_blob_url "$SITE_2_ID")"
          site_3_url="$(resolve_blob_url "$SITE_3_ID")"
          site_4_url="$(resolve_blob_url "$SITE_4_ID")"

          {
            echo '## Screenshots'
            echo
            echo '<table><tr>'
            if [ -n "$site_1_url" ]; then echo "<td><a href=\"$site_1_url\"><img src=\"$site_1_url\" width=\"480\" alt=\"Site 1 screenshot\"></a><br><sub>Site 1</sub></td>"; fi
            if [ -n "$site_2_url" ]; then echo "<td><a href=\"$site_2_url\"><img src=\"$site_2_url\" width=\"480\" alt=\"Site 2 screenshot\"></a><br><sub>Site 2</sub></td>"; fi
            if [ -n "$site_3_url" ]; then echo "<td><a href=\"$site_3_url\"><img src=\"$site_3_url\" width=\"480\" alt=\"Site 3 screenshot\"></a><br><sub>Site 3</sub></td>"; fi
            if [ -n "$site_4_url" ]; then echo "<td><a href=\"$site_4_url\"><img src=\"$site_4_url\" width=\"480\" alt=\"Site 4 screenshot\"></a><br><sub>Site 4</sub></td>"; fi
            echo '</tr></table>'
          } >> "$GITHUB_STEP_SUMMARY"

          headers_file="test-results/site-screenshots/request-response-headers.json"
          if [ -f "$headers_file" ]; then
            {
              echo '## Request and response headers'
              echo
              echo 'Sensitive headers are redacted.'
              echo
              echo '```json'
              cat "$headers_file"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
