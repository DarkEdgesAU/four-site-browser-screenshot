name: Four-site Playwright test

on:
  workflow_dispatch:
    inputs:
      site_urls:
        description: 'Four comma-separated URLs to test'
        required: false
        default: 'https://signon.sso.cba/identity/.well-known/openid-configuration,https://signon.sso.cba/pa/heartbeat.ping,https://proxy.sso.cba/pa/heartbeat.ping,https://radar.cloudflare.com/ip'

permissions:
  actions: read
  contents: read

concurrency:
  group: four-site-screenshots
  cancel-in-progress: false

jobs:
  test-on-arc:
    runs-on: four-site-runner-set
    outputs:
      pages_ready: ${{ steps.upload_pages.outcome == 'success' }}
    container:
      image: docker.io/darkedges/four-site-browser-screenshot:latest
      env:
        SITE_URLS: ${{ inputs.site_urls }}
        HEADLESS: 'true'
      options: --ipc=host

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install project dependencies
        run: npm ci

      - name: Run Playwright test
        id: capture
        run: npm test -- --workers=1

      - name: Upload site 1 screenshot
        if: always()
        uses: actions/upload-artifact@v7
        id: upload_site_1
        with:
          path: test-results/site-screenshots/site-1.jpg
          if-no-files-found: warn
          archive: false
          retention-days: 7

      - name: Upload site 2 screenshot
        if: always()
        uses: actions/upload-artifact@v7
        id: upload_site_2
        with:
          path: test-results/site-screenshots/site-2.jpg
          if-no-files-found: warn
          archive: false
          retention-days: 7

      - name: Upload site 3 screenshot
        if: always()
        uses: actions/upload-artifact@v7
        id: upload_site_3
        with:
          path: test-results/site-screenshots/site-3.jpg
          if-no-files-found: warn
          archive: false
          retention-days: 7

      - name: Upload site 4 screenshot
        if: always()
        uses: actions/upload-artifact@v7
        id: upload_site_4
        with:
          path: test-results/site-screenshots/site-4.jpg
          if-no-files-found: warn
          archive: false
          retention-days: 7

      - name: Upload site 1 network address
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: test-results/site-screenshots/site-1-network-address.json
          if-no-files-found: warn
          archive: false
          retention-days: 7

      - name: Upload site 1 request and response headers
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: test-results/site-screenshots/site-1-request-response-headers.json
          if-no-files-found: warn
          archive: false
          retention-days: 7

      - name: Upload site 2 network address
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: test-results/site-screenshots/site-2-network-address.json
          if-no-files-found: warn
          archive: false
          retention-days: 7

      - name: Upload site 2 request and response headers
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: test-results/site-screenshots/site-2-request-response-headers.json
          if-no-files-found: warn
          archive: false
          retention-days: 7

      - name: Upload site 3 network address
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: test-results/site-screenshots/site-3-network-address.json
          if-no-files-found: warn
          archive: false
          retention-days: 7

      - name: Upload site 3 request and response headers
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: test-results/site-screenshots/site-3-request-response-headers.json
          if-no-files-found: warn
          archive: false
          retention-days: 7

      - name: Upload site 4 network address
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: test-results/site-screenshots/site-4-network-address.json
          if-no-files-found: warn
          archive: false
          retention-days: 7

      - name: Upload site 4 request and response headers
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: test-results/site-screenshots/site-4-request-response-headers.json
          if-no-files-found: warn
          archive: false
          retention-days: 7

      - name: Prepare latest GitHub Pages images
        id: prepare_pages
        if: ${{ !cancelled() && steps.capture.outcome == 'success' }}
        run: |
          mkdir -p pages
          cp test-results/site-screenshots/site-1.jpg pages/site-1.jpg
          cp test-results/site-screenshots/site-2.jpg pages/site-2.jpg
          cp test-results/site-screenshots/site-3.jpg pages/site-3.jpg
          cp test-results/site-screenshots/site-4.jpg pages/site-4.jpg
          {
            echo '<!doctype html>'
            echo '<html lang="en"><head><meta charset="utf-8"><title>Latest browser screenshots</title></head><body>'
            echo '<h1>Latest browser screenshots</h1>'
            echo '<p>Latest published capture. Images are replaced on each deployment; use run artifacts for historical evidence.</p>'
            printf '<p>Source: <a href="%s/%s/actions/runs/%s">run %s, attempt %s</a></p>\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_ATTEMPT"
            echo '<p><img src="site-1.jpg" width="480" alt="Site 1 screenshot"></p>'
            echo '<p><img src="site-2.jpg" width="480" alt="Site 2 screenshot"></p>'
            echo '<p><img src="site-3.jpg" width="480" alt="Site 3 screenshot"></p>'
            echo '<p><img src="site-4.jpg" width="480" alt="Site 4 screenshot"></p>'
            echo '</body></html>'
          } > pages/index.html

      - name: Upload GitHub Pages artifact
        id: upload_pages
        if: ${{ !cancelled() && steps.prepare_pages.outcome == 'success' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages
          retention-days: 1

      - name: Add per-site headers to job summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Per-site network data'
            echo
            for site_number in 1 2 3 4; do
              network_file="test-results/site-screenshots/site-${site_number}-network-address.json"
              headers_file="test-results/site-screenshots/site-${site_number}-request-response-headers.json"
              if [ -f "$network_file" ] || [ -f "$headers_file" ]; then
                echo "### Site ${site_number}"
                echo
                if [ -f "$network_file" ]; then
                  echo '```json'
                  cat "$network_file"
                  printf '\n```\n\n'
                fi
                if [ -f "$headers_file" ]; then
                  echo
                  echo '<details><summary>Request and response headers (sensitive values redacted)</summary>'
                  echo
                  echo '```json'
                  cat "$headers_file"
                  printf '\n```\n\n'
                  echo '</details>'
                fi
                echo
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-pages:
    if: ${{ !cancelled() && needs.test-on-arc.outputs.pages_ready == 'true' }}
    needs: test-on-arc
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy latest screenshots to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Add screenshot gallery to job summary
        uses: actions/github-script@v7
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        with:
          script: |
            const pagesBaseUrl = process.env.PAGES_URL.replace(/\/$/, '')
            const version = `${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}`
            core.summary
              .addHeading('Latest published screenshots', 2)
              .addRaw('<p>These previews use the latest published images and may change after another run. For images from this specific run, use its individual screenshot artifacts below.</p>')
              .addLink('Open latest gallery and capture details', `${pagesBaseUrl}/`)
              .addBreak()
            for (let site = 1; site <= 4; site++) {
              const imageUrl = `${pagesBaseUrl}/site-${site}.jpg?capture=${version}`
              core.summary
                .addHeading(`Site ${site}`, 3)
                .addImage(imageUrl, `Site ${site} screenshot`, { width: '480' })
                .addBreak()
                .addLink(`Open full-size site ${site} image`, imageUrl)
            }
            await core.summary.write()
